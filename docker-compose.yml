name: sovet-doma-local

x-database-environment: &database-environment
  DB_HOST: db
  DB_PORT: 3306
  DB_NAME: sovet_doma
  DB_USER: sovet_doma
  DB_PASSWORD: local-app-password

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sovet_doma
      MYSQL_USER: sovet_doma
      MYSQL_PASSWORD: local-app-password
      MYSQL_ROOT_PASSWORD: local-root-password
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP
          -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE"
          -e 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *logging

  migrate:
    build:
      context: .
      target: migration
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment: *database-environment
    logging: *logging

  api:
    build:
      context: .
      target: production
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *database-environment
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGINS: http://localhost:${LOCAL_PORT:-8080},http://127.0.0.1:${LOCAL_PORT:-8080}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:?Укажите MAX_BOT_TOKEN в .env}
      MAX_BOT_USERNAME: ${MAX_BOT_USERNAME:-t364_hakaton_max_bot}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health', {signal: AbortSignal.timeout(5000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 6s
      retries: 10
      start_period: 15s
    logging: *logging

  frontend:
    build:
      context: ${FRONTEND_PATH:-../max-hackathon-frontend}
      target: local
      args:
        VITE_MAX_BOT_USERNAME: ${MAX_BOT_USERNAME:-t364_hakaton_max_bot}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./docker/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:${LOCAL_PORT:-8080}:80'
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/index.html]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging: *logging

volumes:
  database:
  uploads:
